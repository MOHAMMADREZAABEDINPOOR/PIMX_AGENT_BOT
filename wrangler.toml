# ─────────────────────────────────────────────
# پیکربندی Cloudflare Workers
# ─────────────────────────────────────────────
name = "ai-telegram-bot"
main = "index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# پایگاه داده رابطه‌ای اصلی پروژه (Cloudflare D1) — ۱۰۰,۰۰۰ نوشتن در روز
[[d1_databases]]
binding = "DB"
database_name = "telegram-multi-ai-bots"
database_id = "3255778f-917f-42b0-8ed6-dc8153bf1034"

# ⚠️ مهم: بعد از اجرای «npm run kv» مقدار id را با
# شناسه‌ای که wrangler چاپ می‌کند جایگزین کنید.
[[kv_namespaces]]
binding = "BOT_KV"
id = "5031d78a6400486191fbc129e4797646"

# اجرای Cron هر ۱ دقیقه (برای یادآورها و زمان‌بندی‌ها)
[triggers]
crons = ["* * * * *"]
